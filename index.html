<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuryaTicker Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- SETTINGS PANEL -->
<div id="settings">

<input
type="text"
id="labelText"
placeholder="Enter Label"
value="BREAKING NEWS">

<button onclick="changeLabel()">
Change Label
</button>

</div>

<!-- TICKER -->
<div id="ticker">

<div class="breaking" id="breakingLabel">
BREAKING NEWS
</div>

<div class="scroll">
<div id="news">
Loading...
</div>
</div>

<div class="live" id="liveLabel">
LIVE
</div>

</div>

<!-- JAVASCRIPT FILES -->
<script src="config.js"></script>
<script src="settings.js"></script>
<script src="rss.js"></script>
<script src="ticker.js"></script>
<script src="script.js"></script>

<script>

function changeLabel(){

const txt=document.getElementById("labelText").value.trim();

if(txt!==""){

document.getElementById("breakingLabel").innerHTML=txt;

}

}

</script>

</body>

</html>
