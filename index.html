<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SuryaTicker Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- SETTINGS -->
<div id="settings">

<input type="text" id="labelText" placeholder="Label (BREAKING NEWS)" value="BREAKING NEWS">

<button onclick="changeLabel()">
Change Label
</button>

</div>

<!-- TICKER -->

<div id="ticker">

<div class="breaking" id="breakingLabel">
BREAKING NEWS
</div>

<div class="scroll">

<div id="news">
Loading RSS News...
</div>

</div>

<div class="live">
LIVE
</div>

</div>

<script src="script.js"></script>

<script>

function changeLabel(){

let txt=document.getElementById("labelText").value;

if(txt.trim()!=""){

document.getElementById("breakingLabel").innerHTML=txt;

}

}

</script>

</body>
</html>
