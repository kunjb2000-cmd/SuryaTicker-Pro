<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SuryaTicker Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
     CONTROL PANEL
========================= -->

<div id="settings">

<input
type="text"
id="labelText"
placeholder="Label"
value="BREAKING NEWS">

<button id="btnLabel">
Update Label
</button>

</div>

<!-- =========================
     TICKER
========================= -->

<div id="ticker">

<div class="breaking" id="breakingLabel">
BREAKING NEWS
</div>

<div class="scroll">

<div id="news">
Welcome To SuryaTicker Pro
</div>

</div>

<div class="live" id="liveLabel">
LIVE
</div>

</div>

<!-- =========================
     JAVASCRIPT
========================= -->

<script src="app.js"></script>
<script src="rss.js"></script>

<script>

document
.getElementById("btnLabel")
.addEventListener("click",function(){

const txt=document
.getElementById("labelText")
.value
.trim();

if(txt!=""){

document
.getElementById("breakingLabel")
.innerText=txt;

}

});

</script>

</body>
</html>
